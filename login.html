<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1020">
    <title>Sign in — goWeb</title>
    <link rel="stylesheet" href="assets/css/style.css?v=pro1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="auth-body">
    <main class="auth-shell">
    <div class="auth-brand">
        <div class="logo-icon"><span>G</span></div>
        <div><strong>goWeb</strong><span>Server control, simplified.</span></div>
    </div>
    <div class="glass-panel login-panel">
        <div class="login-heading"><span class="eyebrow">Secure access</span><h1>Welcome back</h1><p>Sign in to manage your applications and server.</p></div>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" type="text" name="username" required autocomplete="username" placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" name="password" required autocomplete="current-password" placeholder="Enter your password">
            </div>
            <button type="submit" class="btn primary full-width">Sign in</button>
            <div id="errorMsg" class="error-text"></div>
        </form>
    </div><p class="auth-footer">Protected server administration</p></main>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const button = e.target.querySelector('button');
            const buttonText = button.textContent;
            button.disabled = true;
            button.textContent = 'Signing in…';
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            try {
                const res = await fetch('api/auth.php?action=login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const json = await res.json();
                if (json.success) {
                    window.location.href = 'index.html';
                } else {
                    document.getElementById('errorMsg').textContent = json.error || 'Login failed';
                }
            } catch (err) {
                document.getElementById('errorMsg').textContent = 'Connection error';
            } finally {
                button.disabled = false;
                button.textContent = buttonText;
            }
        });
    </script>
</body>

</html>
